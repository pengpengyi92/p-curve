[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p-curve"
version = "0.1.0"
description = "Selected open-source curve research utilities from PFICC / P-Curve"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pengyi Peng"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/pengpengyi92/p-curve"
Issues = "https://github.com/pengpengyi92/p-curve/issues"

[tool.setuptools.packages.find]
where = ["src"]
