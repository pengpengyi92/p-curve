name: Offline public-package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install selected package (no runtime dependencies)
        run: python -m pip install --no-deps .
      - name: Independent public tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic example
        run: python examples/synthetic_curve.py
      - name: Publication file and precedent checks
        run: python scripts/publication_check.py
